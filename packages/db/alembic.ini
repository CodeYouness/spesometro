[alembic]
# Uso: uv run alembic -c packages/db/alembic.ini <comando>   (legge DATABASE_URL)
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
# Nessuna stringa di connessione qui: la legge env.py da DATABASE_URL (ADR 0001).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
